<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>RoomStyle | اختيار التصميم</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
  <h1>اختاري تصميم غرفتك</h1>
  <p>جاوبي الأسئلة وخلّي الموقع يقترح لك التصميم المناسب</p>
  <a href="cart.html" class="cart-link">🛒 السلة</a>
</header>

<main class="container">

  <label>نوع الغرفة</label>
  <select id="roomType">
    <option value="">-- اختاري --</option>
    <option value="bedroom">غرفة نوم</option>
    <option value="living">غرفة معيشة</option>
  </select>

  <label>الأسلوب</label>
  <select id="style">
    <option value="">-- اختاري --</option>
    <option value="modern">مودرن</option>
    <option value="classic">كلاسيك</option>
  </select>

  <label>الميزانية</label>
  <select id="budget">
    <option value="">-- اختاري --</option>
    <option value="low">منخفضة</option>
    <option value="medium">متوسطة</option>
    <option value="high">مرتفعة</option>
  </select>

  <button onclick="goToResult()">اعرض التصميم</button>

</main>

<script src="script.js"></script>
</body>
</html>
